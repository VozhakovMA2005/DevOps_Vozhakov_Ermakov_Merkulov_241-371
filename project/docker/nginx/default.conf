# Nginx перед двумя экземплярами AudFond — ЛР4, дополнительное задание.
#
# Подключается в образ nginxinc/nginx-unprivileged внутрь блока http, поэтому
# здесь только upstream, зоны ограничений и server.
#
# Адреса экземпляров — постоянные адреса в сети frontend (docker-compose.yml).
# Имена app1/app2 Nginx разрешает один раз при запуске: если в этот момент
# экземпляр остановлен, Nginx не стартует совсем, а после перезапуска
# контейнера мог бы держать старый адрес. С постоянными адресами этих проблем нет.

upstream audfond {
    # Исключение неработающего узла (доп. пункт 7): две неудачи подряд —
    # узел выводится из распределения на 10 секунд, затем пробуется снова
    server 172.30.40.11:8000 max_fails=2 fail_timeout=10s;   # app1
    server 172.30.40.12:8000 max_fails=2 fail_timeout=10s;   # app2
    keepalive 16;
}

# Ограничение частоты входа (доп. пункт 7): 10 попыток в минуту с одного
# адреса; с burst=5 подряд проходят 6, седьмая сразу получает 429. Защита от
# подбора пароля на уровне прокси, до приложения
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_status 429;

server {
    listen 8080;
    server_name _;

    # Файл реестра для импорта — до 20 МБ (MAX_UPLOAD_BYTES в приложении)
    client_max_body_size 21m;

    # Версию Nginx наружу не сообщаем
    server_tokens off;

    # Проверка живости самого Nginx — для healthcheck контейнера
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Вход: и форма, и API — под ограничением частоты
    location ~ ^/(login|api/v1/auth/login)$ {
        limit_req zone=login burst=5 nodelay;
        proxy_read_timeout 30s;
        include /etc/nginx/conf.d/proxy.inc;
    }

    # Загрузка реестра: файл до 20 МБ разбирается построчно, на большом
    # реестре это минуты, а не секунды
    location /api/v1/imports/ {
        proxy_read_timeout 300s;
        include /etc/nginx/conf.d/proxy.inc;
    }

    location / {
        proxy_read_timeout 60s;
        include /etc/nginx/conf.d/proxy.inc;
    }
}
